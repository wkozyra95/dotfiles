# fuzzel — centered picker, themed to match the waybar/session bar.
# Colors are RRGGBBAA hex (no leading '#').

[main]
font=Source Code Pro:weight=medium:size=12
lines=15
width=80
horizontal-pad=20
vertical-pad=20
inner-pad=16
anchor=center

[colors]
background=323232f5
text=ffffffff
prompt=52e2ffff
input=ffffffff
match=52e2ffff
selection=52e2ffff
selection-text=5c5c5cff
selection-match=323232ff
border=52e2ffff

[border]
width=2
radius=8
